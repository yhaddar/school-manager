$kind: http-example
name: 422 Invalid activation credential
request:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/activation'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"username":"student.1001","temporary_password":"incorrect","password":"Personal#1001","password_confirmation":"Personal#1001"}
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"message":"Invalid activation credentials."}
order: 2000
