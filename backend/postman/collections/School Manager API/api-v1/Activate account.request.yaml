$kind: http-request
description: Activates a staff or student account with the temporary credential delivered by its institution.
url: "{{baseUrl}}/api/v1/auth/activation"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "student.1001",
      "temporary_password": "replace-with-temporary-password",
      "password": "Personal#1001",
      "password_confirmation": "Personal#1001"
    }
settings: {}
examples: './.resources/Activate account.resources/examples'
order: 2000
