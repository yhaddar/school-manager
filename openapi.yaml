openapi: 3.1.0
info:
  title: School Manager API
  version: 0.1.0
  description: Foundation contract for account activation, opaque rotating mobile API sessions, and server-derived tenant context. All endpoints require authentication except where noted.

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      summary: Read service health
      responses:
        '200':
          description: Service is available

  /api/v1/user:
    get:
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing, expired, or revoked access token

  /api/v1/tenant-context:
    get:
      summary: Read the authenticated user's server-derived institution context
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active institution context
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [institution_id]
                    properties:
                      institution_id:
                        type: string
                        format: uuid
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: No active authorized membership

  /api/v1/auth/sessions:
    post:
      summary: Create an API session with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Session tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Invalid credentials or request validation failure
        '429':
          description: Login attempts are throttled

  /api/v1/auth/activation:
    post:
      summary: Activate a staff or student account with its temporary credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActivationRequest'
      responses:
        '201':
          description: Account activated and session tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Activation credential is invalid, expired, used, or the new password is invalid
        '429':
          description: Activation attempts are throttled

  /api/v1/auth/sessions/refresh:
    post:
      summary: Rotate an API session refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Replacement session tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token is invalid, expired, revoked, or reused

  /api/v1/auth/sessions/current:
    delete:
      summary: Revoke the current API session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          description: Missing, expired, or revoked access token

  /api/v1/super-admin/institutions:
    get:
      summary: List all institutions (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, suspended, archived]
          description: Filter by institution status
        - name: search
          in: query
          schema:
            type: string
          description: Search by institution name
      responses:
        '200':
          description: List of institutions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
    post:
      summary: Create a new institution (Super Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstitutionRequest'
      responses:
        '201':
          description: Institution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '422':
          description: Validation error

  /api/v1/super-admin/institutions/{id}:
    get:
      summary: Get institution details (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found
    put:
      summary: Update institution (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstitutionRequest'
      responses:
        '200':
          description: Institution updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found
        '422':
          description: Validation error
    delete:
      summary: Archive institution (Super Admin only)
      description: Archive institution by setting status to inactive. Prevents archiving if active memberships exist.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institution archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found
        '422':
          description: Cannot archive institution with active memberships

  /api/v1/super-admin/institutions/{id}/activate:
    post:
      summary: Activate institution (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institution activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found

  /api/v1/super-admin/institutions/{id}/suspend:
    post:
      summary: Suspend institution (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institution suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found

  /api/v1/super-admin/institutions/{id}/reactivate:
    post:
      summary: Reactivate suspended institution (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institution reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found

  /api/v1/super-admin/institutions/{id}/archive:
    post:
      summary: Archive institution (Super Admin only)
      description: Archive institution by setting status to archived. Different from DELETE which sets to inactive.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institution archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found

  /api/v1/super-admin/institutions/{id}/restore:
    post:
      summary: Restore archived institution (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institution restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution not found

  /api/v1/super-admin/subscriptions:
    get:
      summary: List active subscription plans (Super Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of subscription plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionPlanResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
    post:
      summary: Create a new subscription plan (Super Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionPlanRequest'
      responses:
        '201':
          description: Subscription plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '422':
          description: Validation error

  /api/v1/super-admin/subscriptions/list:
    get:
      summary: List all institution subscriptions (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, cancelled, pending]
          description: Filter by subscription status
      responses:
        '200':
          description: Paginated list of institution subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubscriptionList'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required

  /api/v1/super-admin/subscriptions/{plan}:
    get:
      summary: Get subscription plan details (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Plan not found
    put:
      summary: Update subscription plan (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionPlanRequest'
      responses:
        '200':
          description: Subscription plan updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Plan not found
        '422':
          description: Validation error
    delete:
      summary: Delete subscription plan (Super Admin only)
      description: Cannot delete plan if assigned to institutions.
      security:
        - bearerAuth: []
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Plan deleted
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Plan not found
        '422':
          description: Cannot delete plan assigned to institutions

  /api/v1/super-admin/institutions/{institution}/subscription:
    post:
      summary: Assign subscription plan to institution (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: institution
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSubscriptionRequest'
      responses:
        '201':
          description: Subscription assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionSubscriptionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution or plan not found
        '422':
          description: Validation error

  /api/v1/super-admin/institutions/{institution}/subscription/renew:
    post:
      summary: Renew institution's subscription (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: institution
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewSubscriptionRequest'
      responses:
        '200':
          description: Subscription renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionSubscriptionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution or subscription not found
        '422':
          description: Validation error

  /api/v1/super-admin/institutions/{institution}/subscription/history:
    get:
      summary: Get subscription history for institution (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: institution
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionHistoryResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Institution or subscription not found

  /api/v1/super-admin/support/requests:
    post:
      summary: Create support request (Super Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportRequestRequest'
      responses:
        '201':
          description: Support request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '422':
          description: Validation error
    get:
      summary: List support requests (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, denied, resolved]
          description: Filter by request status
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
          description: Filter by priority level
        - name: institution_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by institution ID
      responses:
        '200':
          description: Paginated list of support requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupportRequestList'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required

  /api/v1/super-admin/support/requests/{supportRequest}:
    get:
      summary: Get support request details (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: supportRequest
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Support request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Support request not found
    post:
      summary: Approve support request (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: supportRequest
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Support request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Support request not found

  /api/v1/super-admin/support/requests/{supportRequest}/deny:
    post:
      summary: Deny support request (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: supportRequest
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Support request denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Support request not found

  /api/v1/super-admin/support/requests/{supportRequest}/access:
    post:
      summary: Grant support session access (Super Admin only)
      description: Requires support request to be approved first. Creates a time-limited session for troubleshooting.
      security:
        - bearerAuth: []
      parameters:
        - name: supportRequest
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Support session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSessionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '422':
          description: Cannot grant access - request must be approved first

  /api/v1/super-admin/support/requests/{supportRequest}/audit:
    get:
      summary: Get support request audit log (Super Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: supportRequest
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        user_id:
                          type: integer
                        timestamp:
                          type: string
                          format: date-time
                        session_token:
                          type: string
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Support request not found

  /api/v1/super-admin/support/sessions/{session}/terminate:
    post:
      summary: Terminate support session (Super Admin only)
      description: End a support session before its expiration time.
      security:
        - bearerAuth: []
      parameters:
        - name: session
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Session terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSessionResponse'
        '401':
          description: Missing, expired, or revoked access token
        '403':
          description: Unauthorized - Super Admin role required
        '404':
          description: Session not found

  /api/v1/management/courses/{course}/teacher:
    post:
      summary: Assign a teacher to a course
      description: Only institution administrators can assign teachers to courses.
      security:
        - bearerAuth: []
      parameters:
        - name: course
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseTeacherAssignmentRequest'
      responses:
        '200':
          description: Teacher assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseTeacherAssignmentResponse'
        '403':
          description: Forbidden - user lacks administrator privileges
        '404':
          description: Course or teacher not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, email, username, user_type, is_active, active_institution_id, membership_role]
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            username:
              type: string
            user_type:
              type: string
              enum: [staff, student, parent]
            is_active:
              type: boolean
            active_institution_id:
              type: string
              format: uuid
              nullable: true
            membership_role:
              type: string
              enum: [super-admin, administrator, director, professor, teacher, student, parent]
              nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AccountActivationRequest:
      type: object
      required: [username, temporary_password, password, password_confirmation]
      properties:
        username:
          type: string
        temporary_password:
          type: string
          format: password
        password:
          type: string
          format: password
          description: At least 12 characters with mixed case, a number, and a symbol.
        password_confirmation:
          type: string
          format: password

    TokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, refresh_token, access_expires_at, refresh_expires_at]
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            access_expires_at:
              type: string
              format: date-time
            refresh_expires_at:
              type: string
              format: date-time
            user_id:
              type: integer
              description: The user ID for client-side storage

    CourseTeacherAssignmentRequest:
      type: object
      required: [teacher_id]
      properties:
        teacher_id:
          type: integer
          description: The user ID of the teacher to assign

    CourseTeacherAssignmentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, teacher_id, teacher_name]
          properties:
            id:
              type: integer
              description: Course ID
            teacher_id:
              type: integer
              description: Assigned teacher's user ID
            teacher_name:
              type: string
              description: Teacher's name

    InstitutionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended, archived]
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        member_count:
          type: integer

    CreateInstitutionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        status:
          type: string
          enum: [active, inactive, suspended]

    UpdateInstitutionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        status:
          type: string
          enum: [active, inactive, suspended]

    SubscriptionPlanResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tier:
          type: string
          enum: [basic, professional, enterprise]
        features:
          type: array
